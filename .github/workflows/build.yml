name: Build ANWAR CH 04 VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build VST3
        run: |
          cmake -B build -S ANWAR_CH_04_SYNTH -A x64
          cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ANWAR-CH-04-VST3
          path: build/ANWAR_CH_04_VST_artefacts/Release/VST3/
